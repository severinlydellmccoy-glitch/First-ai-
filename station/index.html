<style>
/* Layout: a top-down station map filling the screen, a status readout top-left, and a control panel docked right (bottom sheet on phones). */
:root {
  --space: #05070d;
  --hull: rgba(11, 16, 26, 0.9);
  --line: #26344a;
  --text: #e7edf6;
  --muted: #95a3ba;
  --live: #62d8ff;
  --plan: #ffb547;
  --font-display: "Oxanium", "Segoe UI", system-ui, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; overflow: hidden; }
body {
  background: var(--space); color: var(--text); font-family: var(--font-body); font-size: 14px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
#map { position: fixed; inset: 0; display: block; touch-action: none; cursor: grab; }
#map.dragging { cursor: grabbing; }

.hud {
  position: fixed; z-index: 3;
  top: calc(env(safe-area-inset-top, 0px) + 14px);
  left: max(16px, env(safe-area-inset-left, 0px));
  max-width: min(420px, calc(100% - 32px));
  pointer-events: none;
}
.hud h1 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 22px; letter-spacing: 0.04em; text-wrap: balance; }
.hud p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
.hud .counts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chip { font-family: var(--font-mono); font-size: 11.5px; padding: 3px 8px; border-radius: 4px; border: 1px solid var(--line); background: var(--hull); font-variant-numeric: tabular-nums; }
.chip.live { color: var(--live); border-color: color-mix(in srgb, var(--live) 40%, transparent); }
.chip.plan { color: var(--plan); border-color: color-mix(in srgb, var(--plan) 40%, transparent); }

#panel {
  position: fixed; z-index: 4;
  top: calc(env(safe-area-inset-top, 0px) + 14px);
  right: max(16px, env(safe-area-inset-right, 0px));
  width: 360px;
  max-height: calc(100% - 28px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
  overflow-y: auto;
  background: var(--hull); border: 1px solid var(--line); border-radius: 10px;
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  padding: 18px;
}
#panel h2 { margin: 0 0 4px; font-family: var(--font-display); font-size: 20px; font-weight: 700; letter-spacing: 0.03em; text-wrap: balance; }
#panel h3 { margin: 18px 0 8px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); }
#panel p { margin: 0; }
.lede { color: var(--muted); }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 99px; margin-bottom: 10px; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill.active { color: var(--live); background: color-mix(in srgb, var(--live) 14%, transparent); }
.pill.empty { color: var(--live); background: transparent; border: 1px dashed color-mix(in srgb, var(--live) 55%, transparent); }
.pill.planned { color: var(--plan); background: color-mix(in srgb, var(--plan) 14%, transparent); }
.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.list li { display: grid; gap: 1px; padding: 8px 10px; border-radius: 6px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05); }
.list .file { font-family: var(--font-mono); font-size: 12.5px; color: var(--live); }
.list .note { color: var(--muted); font-size: 13px; }
.list .none { color: var(--muted); font-style: italic; }
.rooms { display: grid; gap: 6px; }
.room-btn {
  display: grid; grid-template-columns: 10px 1fr auto; align-items: center; gap: 10px;
  width: 100%; text-align: left; font: inherit; color: var(--text); cursor: pointer;
  padding: 9px 10px; border-radius: 6px; border: 1px solid var(--line); background: rgba(255,255,255,0.02);
}
.room-btn:hover { border-color: var(--muted); background: rgba(255,255,255,0.05); }
.room-btn:focus-visible, .back:focus-visible { outline: 2px solid var(--live); outline-offset: 2px; }
.dot { width: 10px; height: 10px; border-radius: 50%; }
.dot.active { background: var(--live); box-shadow: 0 0 8px var(--live); }
.dot.empty { border: 1.5px solid var(--live); }
.dot.planned { border: 1.5px dashed var(--plan); }
.room-btn small { color: var(--muted); font-size: 12px; }
.agent { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 8px 10px; border-radius: 6px; border: 1px dashed color-mix(in srgb, var(--plan) 35%, transparent); }
.agent.ready, .agent.running { border: 1px solid color-mix(in srgb, var(--live) 40%, transparent); }
.agent strong { font-weight: 600; }
.agent span { color: var(--plan); font-size: 12px; align-self: center; }
.agent.ready span, .agent.running span { color: var(--live); }
.agent p { grid-column: 1 / -1; color: var(--muted); font-size: 13px; }
.crew-head { display: flex; justify-content: space-between; align-items: baseline; margin: 18px 0 8px; }
.crew-head h3 { margin: 0 !important; }
.crew-head span { font-family: var(--font-mono); font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.crew { display: grid; gap: 6px; }
.crew-card {
  display: grid; grid-template-columns: 48px 1fr auto; align-items: center; gap: 12px;
  width: 100%; text-align: left; font: inherit; color: var(--text); cursor: pointer;
  padding: 7px 10px 7px 7px; border-radius: 8px; border: 1px dashed color-mix(in srgb, var(--plan) 35%, transparent); background: rgba(255,255,255,0.02);
}
.crew-card.on { border: 1px solid color-mix(in srgb, var(--live) 45%, transparent); background: color-mix(in srgb, var(--live) 6%, transparent); }
.crew-card.picked { box-shadow: 0 0 0 2px var(--live), 0 0 16px color-mix(in srgb, var(--live) 40%, transparent); }
.crew-card:hover { background: rgba(255,255,255,0.05); }
.crew-card:focus-visible { outline: 2px solid var(--live); outline-offset: 2px; }
.crew-card img { width: 48px; height: 48px; border-radius: 6px; background: #12161d; border: 1px solid var(--line); }
.crew-card b { display: block; font-family: var(--font-display); font-weight: 700; font-size: 15px; letter-spacing: 0.08em; text-transform: uppercase; }
.crew-card small { display: block; color: var(--muted); font-size: 12px; }
.crew-card em { font-style: normal; font-family: var(--font-mono); font-size: 11.5px; color: var(--plan); }
.crew-card.on em { color: var(--live); }
.todo { border: 1px solid color-mix(in srgb, #f2c230 45%, transparent); background: color-mix(in srgb, #f2c230 7%, transparent); border-radius: 8px; padding: 12px 14px; margin-top: 14px; }
.todo h3 { margin: 0 0 8px !important; color: #f2c230 !important; }
.todo ol { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.todo li span { color: var(--muted); font-size: 12px; margin-left: 6px; font-family: var(--font-mono); }
.todo p { margin-top: 8px !important; font-size: 12.5px; color: var(--muted); }
.report { border: 1px solid color-mix(in srgb, #f2c230 45%, transparent); background: color-mix(in srgb, #f2c230 7%, transparent); border-radius: 8px; padding: 12px 14px; margin: 4px 0 6px; display: grid; gap: 8px; }
.report header { display: flex; align-items: center; gap: 10px; }
.report header img { width: 40px; height: 40px; border-radius: 6px; border: 1px solid var(--line); }
.report header b { display: block; font-family: var(--font-display); letter-spacing: 0.06em; text-transform: uppercase; }
.report header small { color: var(--muted); font-size: 12px; }
.report dl { margin: 0; display: grid; gap: 6px; }
.report dt { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: #f2c230; }
.report dd { margin: 0; font-size: 13.5px; }
.legend { display: grid; gap: 6px; font-size: 13px; color: var(--muted); }
.legend div { display: flex; align-items: center; gap: 8px; }
.back { font: inherit; font-size: 13px; color: var(--muted); background: none; border: 0; padding: 0; margin-bottom: 12px; cursor: pointer; }
.back:hover { color: var(--text); }
.next { padding: 10px 12px; border-left: 2px solid var(--live); background: rgba(98,216,255,0.06); border-radius: 0 6px 6px 0; }
.next.planned { border-left-color: var(--plan); background: rgba(255,181,71,0.06); }
.foot { margin-top: 18px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }
a { color: var(--live); }
.hint { font-size: 13px; color: var(--muted); }

@media (max-width: 700px) {
  .hud h1 { font-size: 18px; }
  .hud p { display: none; }
  #panel {
    top: auto; width: auto;
    left: max(16px, env(safe-area-inset-left, 0px));
    bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
    max-height: 42%;
    padding: 14px;
  }
}
</style>

function portrait(color, powered, planned, crown) {
  const cv2 = document.createElement("canvas"); cv2.width = cv2.height = 96;
  const g = cv2.getContext("2d");
  const bg = g.createRadialGradient(48, 40, 4, 48, 48, 60); bg.addColorStop(0, planned ? "#2a2214" : "#1c2633"); bg.addColorStop(1, "#0c1016");
  g.fillStyle = bg; g.fillRect(0, 0, 96, 96);
  if (planned) { g.setLineDash([5, 4]); g.strokeStyle = "#ffb547"; g.lineWidth = 3; }
  // body
  g.beginPath(); g.arc(48, 84, 30, Math.PI, 0); if (planned) g.stroke(); else { g.fillStyle = color; g.fill(); }
  // head
  g.beginPath(); g.arc(48, 46, 24, 0, Math.PI * 2); if (planned) g.stroke(); else { g.fillStyle = "#f3e3c3"; g.fill(); g.strokeStyle = "#b9ab8e"; g.lineWidth = 2; g.stroke(); }
  // ears
  [[22, 46], [74, 46]].forEach(([x, y]) => { g.beginPath(); g.arc(x, y, 6, 0, Math.PI * 2); if (planned) g.stroke(); else { g.fillStyle = color; g.fill(); } });
  // visor
  if (!planned) {
    g.save(); if (powered) { g.shadowColor = "#62d8ff"; g.shadowBlur = 12; g.fillStyle = "#62d8ff"; } else g.fillStyle = "#283040";
    g.beginPath(); g.roundRect ? g.roundRect(32, 40, 32, 12, 5) : g.rect(32, 40, 32, 12); g.fill(); g.restore();
  }
  // antenna
  g.setLineDash([]); g.strokeStyle = planned ? "#ffb547" : "#8b949e"; g.lineWidth = 2;
  g.beginPath(); g.moveTo(48, 22); g.lineTo(48, 10); g.stroke();
  g.beginPath(); g.arc(48, 8, 4, 0, Math.PI * 2); g.fillStyle = planned ? "#ffb547" : powered ? "#62d8ff" : "#3a4458"; g.fill();
  if (crown) {
    g.setLineDash([]); g.fillStyle = "#f2c230"; g.strokeStyle = "#a07a10"; g.lineWidth = 1.5;
    g.beginPath(); g.moveTo(30, 26); g.lineTo(34, 12); g.lineTo(41, 21); g.lineTo(48, 8); g.lineTo(55, 21); g.lineTo(62, 12); g.lineTo(66, 26); g.closePath(); g.fill(); g.stroke();
  }
  if (!powered && !planned) { g.fillStyle = "rgba(200,210,225,0.8)"; g.font = "bold 16px Inter, sans-serif"; g.fillText("z", 70, 24); g.font = "bold 11px Inter, sans-serif"; g.fillText("z", 80, 14); }
  return cv2.toDataURL();
}

/* ---------- Map ---------- */
const T = 32; // pixels per floor tile
const C = {
  wallTop: "#9aa3ae", wallHi: "#c9d0d8", wallSide: "#4b525d", wallDark: "#2c3139",
  floor: "#22262d", floorLine: "#2d323a", corridor: "#1d2127",
  live: "#62d8ff", plan: "#ffb547", crt: "#6dff8e",
  orange: "#e8692c", mustard: "#e3a72f", cream: "#f3e3c3", pink: "#d94f8a", teal: "#2f9c95", avocado: "#8a9a3b",
};
const cv = document.getElementById("map"), ctx = cv.getContext("2d");
let W = 0, H = 0, dpr = 1;
const cam = { x: 25 * T, y: 20 * T, z: 0.5 };
let camTo = null;

function viewport() {
  if (W < 700) return { x: 0, y: 100, w: W, h: H * 0.58 - 108 };
  return { x: 0, y: 110, w: W - 396, h: H - 120 };
}
function fitRect(x, y, w, h, instant) {
  const v = viewport(), pad = 28;
  const z = Math.max(0.2, Math.min(2.6, Math.min((v.w - pad * 2) / w, (v.h - pad * 2) / h)));
  const target = { x: x + w / 2, y: y + h / 2, z };
  if (instant || reduceMotion) { Object.assign(cam, target); camTo = null; } else camTo = target;
}
function fitAll(instant) { fitRect(3 * T, -1 * T, 43 * T, 40 * T, instant); }
function focusRoom(m, instant) { fitRect((m.x - 0.8) * T, (m.y - 1.6) * T, (m.w + 1.6) * T, (m.h + 2.6) * T, instant); }
function vcenter() { const v = viewport(); return { x: v.x + v.w / 2, y: v.y + v.h / 2 }; }
function toWorld(sx, sy) { const c = vcenter(); return { x: (sx - c.x) / cam.z + cam.x, y: (sy - c.y) / cam.z + cam.y }; }
function toScreen(wx, wy) { const c = vcenter(); return { x: (wx - cam.x) * cam.z + c.x, y: (wy - cam.y) * cam.z + c.y }; }

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W * dpr; cv.height = H * dpr; cv.style.width = W + "px"; cv.style.height = H + "px";
  if (selected) focusRoom(selected, true); else fitAll(true);
}

/* drawing helpers, all in floor tiles */
const P = v => v * T;
function rrect(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h); }
function dashed(fn) { ctx.save(); ctx.setLineDash([6, 4]); ctx.strokeStyle = C.plan; ctx.globalAlpha = 0.85; ctx.lineWidth = 1.6; fn(); ctx.restore(); }

function box(bp, x, y, w, h, fill, edge) {
  if (bp) return dashed(() => ctx.strokeRect(P(x), P(y), P(w), P(h)));
  ctx.fillStyle = fill; ctx.fillRect(P(x), P(y), P(w), P(h));
  if (edge) { ctx.strokeStyle = edge; ctx.lineWidth = 2; ctx.strokeRect(P(x) + 1, P(y) + 1, P(w) - 2, P(h) - 2); }
}
function circle(bp, x, y, r, fill, edge) {
  ctx.beginPath(); ctx.arc(P(x), P(y), P(r), 0, Math.PI * 2);
  if (bp) return dashed(() => ctx.stroke());
  ctx.fillStyle = fill; ctx.fill();
  if (edge) { ctx.strokeStyle = edge; ctx.lineWidth = 2; ctx.stroke(); }
}
function glow(bp, x, y, w, h, color, strength = 1) {
  if (bp) return box(true, x, y, w, h);
  ctx.save(); ctx.shadowColor = color; ctx.shadowBlur = 14 * strength; ctx.fillStyle = color; ctx.globalAlpha = 0.55 + 0.4 * strength;
  ctx.fillRect(P(x), P(y), P(w), P(h)); ctx.restore();
}
function desk(bp, x, y, w, screens, color, t) {
  box(bp, x, y, w, 1, "#5b636e", "#7b848f");
  for (let i = 0; i < screens; i++) {
    const flick = reduceMotion ? 1 : 0.75 + 0.25 * Math.sin(t * 3 + i * 2 + x);
    glow(bp, x + 0.25 + i * ((w - 0.5) / screens), y + 0.18, (w - 0.5) / screens - 0.2, 0.42, color, flick);
  }
}
function conveyor(bp, x, y, len, n, t) {
  box(bp, x, y, len, 0.9, "#14171c");
  if (bp) return;
  ctx.fillStyle = "#8b949e"; ctx.fillRect(P(x), P(y) - 2, P(len), 3); ctx.fillRect(P(x), P(y + 0.9) - 1, P(len), 3);
  ctx.strokeStyle = "#2b3038"; ctx.lineWidth = 2;
  const off = n > 0 && !reduceMotion ? (t * 0.8) % 0.45 : 0;
  for (let rx = x + off; rx < x + len; rx += 0.45) { ctx.beginPath(); ctx.moveTo(P(rx), P(y) + 3); ctx.lineTo(P(rx), P(y + 0.9) - 3); ctx.stroke(); }
  for (let i = 0; i < Math.min(n, 8); i++) {
    const p = ((n > 0 && !reduceMotion ? t * 0.1 : 0) + i / Math.min(n, 8)) % 1;
    box(false, x + 0.15 + p * (len - 0.75), y + 0.18, 0.55, 0.55, C.mustard, "#b07d1c");
  }
}
function bin(bp, x, y, w, h) { box(bp, x, y, w, h, "#2d333b", "#9aa3ae"); if (!bp) box(false, x + 0.2, y + 0.2, w - 0.4, h - 0.4, "#181b20"); }
function rug(x, y, r) {
  const cols = [C.orange, C.mustard, C.cream, C.pink, C.avocado];
  ctx.save(); ctx.globalAlpha = 0.3;
  for (let i = 5; i > 0; i--) { ctx.beginPath(); ctx.arc(P(x), P(y), P(r * i / 5), 0, Math.PI * 2); ctx.fillStyle = cols[i % cols.length]; ctx.fill(); }
  ctx.restore();
}
function lavaLamp(x, y, color, blob, t) {
  ctx.save(); ctx.shadowColor = color; ctx.shadowBlur = 18;
  ctx.beginPath(); ctx.arc(P(x), P(y), P(0.32), 0, Math.PI * 2); ctx.fillStyle = color; ctx.globalAlpha = 0.7; ctx.fill(); ctx.restore();
  for (let i = 0; i < 3; i++) {
    const a = (reduceMotion ? 0 : t * 0.8) + i * 2.1;
    ctx.beginPath(); ctx.arc(P(x + Math.cos(a) * 0.13), P(y + Math.sin(a * 1.3) * 0.13), P(0.08), 0, Math.PI * 2); ctx.fillStyle = blob; ctx.fill();
  }
  ctx.beginPath(); ctx.arc(P(x), P(y), P(0.36), 0, Math.PI * 2); ctx.strokeStyle = "#c9ced6"; ctx.lineWidth = 2; ctx.stroke();
}

}

// Placeholder crew: gray robots holding space for future agents. They walk around but do no work.
function addPlaceholder(room, pts) {
  const abs = pts.map(([px, py]) => ({ x: room.x + px, y: room.y + py }));
  bots.push({ room, key: null, name: "Placeholder", color: "#7d8691", powered: true, bp: false, placeholder: true, pts: abs, i: 0, x: abs[0].x, y: abs[0].y, wait: Math.random() * 3, phase: Math.random() * 6, face: 1, size: 0.85 });
}
function stepBots(dt) {
  if (reduceMotion) return;
  bots.forEach(b => {
    if (!b.powered || b.pts.length < 2) return;
    if (b.wait > 0) { b.wait -= dt; return; }
    const nxt = b.pts[(b.i + 1) % b.pts.length], dx = nxt.x - b.x, dy = nxt.y - b.y, d = Math.hypot(dx, dy), sp = 1.3 * dt;
    if (d <= sp) { b.x = nxt.x; b.y = nxt.y; b.i = (b.i + 1) % b.pts.length; b.wait = 1.2 + Math.random() * 1.6; }
    else { b.x += dx / d * sp; b.y += dy / d * sp; if (Math.abs(dx) > 0.01) b.face = Math.sign(dx); }
  });
}
function shade(hex, f) {
  const n = parseInt(hex.slice(1), 16), r = Math.min(255, (n >> 16) * f), g = Math.min(255, ((n >> 8) & 255) * f), b = Math.min(255, (n & 255) * f);
  return `rgb(${r | 0},${g | 0},${b | 0})`;
}
function drawBot(b, t) {
  const bob = b.powered && !reduceMotion ? Math.sin(t * 3 + b.phase) * 0.04 : 0;
  const x = P(b.x), y = P(b.y + bob), r = P(0.34 * b.size);
  if (b.bp) { ctx.save(); ctx.setLineDash([4, 3]); ctx.strokeStyle = C.plan; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.stroke(); ctx.beginPath(); ctx.arc(x, y - r * 0.55, r * 0.6, 0, Math.PI * 2); ctx.stroke(); ctx.restore(); return; }
  ctx.fillStyle = "rgba(0,0,0,0.35)"; ctx.beginPath(); ctx.ellipse(x, P(b.y) + r * 0.85, r * 0.95, r * 0.35, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fillStyle = b.color; ctx.fill(); ctx.strokeStyle = shade(b.color, 0.6); ctx.lineWidth = 2; ctx.stroke();
  const hy = y - r * 0.6, hr = r * 0.62;
  ctx.beginPath(); ctx.arc(x, hy, hr, 0, Math.PI * 2); ctx.fillStyle = C.cream; ctx.fill(); ctx.strokeStyle = "#b9ab8e"; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.save();
  if (b.placeholder) { ctx.fillStyle = "#c8b48a"; } else if (b.powered) { ctx.shadowColor = C.live; ctx.shadowBlur = 10; ctx.fillStyle = C.live; } else ctx.fillStyle = "#283040";
  rrect(x - hr * 0.7 + b.face * hr * 0.12, hy - hr * 0.22, hr * 1.4, hr * 0.44, hr * 0.2); ctx.fill(); ctx.restore();
  ctx.strokeStyle = "#8b949e"; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(x, hy - hr); ctx.lineTo(x, hy - hr * 1.6); ctx.stroke();
  ctx.beginPath(); ctx.arc(x, hy - hr * 1.7, 2.5, 0, Math.PI * 2);
  ctx.fillStyle = b.powered ? (Math.sin(t * 4 + b.phase) > 0 ? C.live : "#2c6a80") : "#3a4458"; ctx.fill();
  if (b.badge) {
    ctx.save(); ctx.fillStyle = "#f2c230"; ctx.strokeStyle = "#a07a10"; ctx.lineWidth = 1;
    const bx = x + r * 0.35, by = y + r * 0.15, br = r * 0.26; ctx.beginPath();
    for (let k = 0; k < 10; k++) { const a = -Math.PI / 2 + k * Math.PI / 5, rr = k % 2 ? br * 0.45 : br; ctx.lineTo(bx + Math.cos(a) * rr, by + Math.sin(a) * rr); }
    ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore();
  }
  if (b.crown) {
    const cy = hy - hr * 0.75, cw = hr * 1.1;
    ctx.fillStyle = "#f2c230"; ctx.strokeStyle = "#a07a10"; ctx.lineWidth = 1.2; ctx.beginPath();
    ctx.moveTo(x - cw / 2, cy); ctx.lineTo(x - cw / 2 + cw * 0.1, cy - hr * 0.7); ctx.lineTo(x - cw * 0.17, cy - hr * 0.3); ctx.lineTo(x, cy - hr * 0.9);
    ctx.lineTo(x + cw * 0.17, cy - hr * 0.3); ctx.lineTo(x + cw / 2 - cw * 0.1, cy - hr * 0.7); ctx.lineTo(x + cw / 2, cy); ctx.closePath(); ctx.fill(); ctx.stroke();
  }
  if (!b.powered && !reduceMotion) {
    ctx.fillStyle = "rgba(200,210,225,0.7)"; ctx.font = `600 ${P(0.3)}px Inter, sans-serif`;
    const zz = (t * 0.5 + b.phase) % 1;
    ctx.globalAlpha = 1 - zz; ctx.fillText("z", x + r * 0.7, hy - hr - zz * P(0.5)); ctx.globalAlpha = 1;
  }
}

/* ---------- Rooms ---------- */
function drawShell(m, t) {
  const X = P(m.x), Y = P(m.y), Wd = P(m.w), Ht = P(m.h), wall = 9;
  if (m.status === "planned") {
    ctx.fillStyle = "rgba(255,181,71,0.04)"; ctx.fillRect(X, Y, Wd, Ht);
    ctx.save(); ctx.strokeStyle = "rgba(255,181,71,0.12)"; ctx.lineWidth = 1;
    for (let gx = 1; gx < m.w; gx++) { ctx.beginPath(); ctx.moveTo(X + P(gx), Y); ctx.lineTo(X + P(gx), Y + Ht); ctx.stroke(); }
    for (let gy = 1; gy < m.h; gy++) { ctx.beginPath(); ctx.moveTo(X, Y + P(gy)); ctx.lineTo(X + Wd, Y + P(gy)); ctx.stroke(); }
    ctx.restore();
    ctx.save(); ctx.setLineDash([10, 6]); ctx.strokeStyle = C.plan; ctx.lineWidth = 3; ctx.strokeRect(X - 4, Y - 4, Wd + 8, Ht + 8); ctx.restore();
    // hazard corners
    [[X - 6, Y - 6], [X + Wd - 18, Y - 6], [X - 6, Y + Ht - 18], [X + Wd - 18, Y + Ht - 18]].forEach(([cx, cy]) => hazard(cx, cy, 24, 24));
    return;
  }
  // side of the wall (3/4 view), then top of the wall, then floor
  ctx.fillStyle = C.wallSide; rrect(X - wall, Y - wall, Wd + wall * 2, Ht + wall * 2 + 8, 8); ctx.fill();
  ctx.fillStyle = C.wallTop; rrect(X - wall, Y - wall, Wd + wall * 2, Ht + wall * 2, 8); ctx.fill();
  ctx.strokeStyle = C.wallHi; ctx.lineWidth = 2; rrect(X - wall + 1, Y - wall + 1, Wd + wall * 2 - 2, Ht + wall * 2 - 2, 8); ctx.stroke();
  ctx.fillStyle = C.floor; ctx.fillRect(X, Y, Wd, Ht);
  ctx.fillStyle = C.wallDark; ctx.fillRect(X, Y, Wd, 10); // shadow under the top wall
  ctx.strokeStyle = C.floorLine; ctx.lineWidth = 1;
  for (let gx = 1; gx < m.w; gx++) { ctx.beginPath(); ctx.moveTo(X + P(gx), Y); ctx.lineTo(X + P(gx), Y + Ht); ctx.stroke(); }
  for (let gy = 1; gy < m.h; gy++) { ctx.beginPath(); ctx.moveTo(X, Y + P(gy)); ctx.lineTo(X + Wd, Y + P(gy)); ctx.stroke(); }
  // warm ceiling light
  const g = ctx.createRadialGradient(X + Wd / 2, Y + Ht / 2, 0, X + Wd / 2, Y + Ht / 2, Math.max(Wd, Ht) * 0.65);
  g.addColorStop(0, m.status === "active" ? "rgba(255,196,120,0.2)" : "rgba(255,196,120,0.1)"); g.addColorStop(1, "rgba(255,196,120,0)");
  ctx.fillStyle = g; ctx.fillRect(X, Y, Wd, Ht);
  // wall panels
  ctx.fillStyle = "#7d8691";
  for (let px = X + 12; px < X + Wd - 20; px += 46) ctx.fillRect(px, Y - wall + 3, 30, 3);
}
function hazard(x, y, w, h) {
  ctx.save(); ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
  ctx.fillStyle = "#1a1a1a"; ctx.fillRect(x, y, w, h); ctx.strokeStyle = "#f2c230"; ctx.lineWidth = 4;
  for (let i = -h; i < w + h; i += 9) { ctx.beginPath(); ctx.moveTo(x + i, y + h); ctx.lineTo(x + i + h, y); ctx.stroke(); }
  ctx.restore();
}
function corridorPackets(c, t) {
  const n = Math.min(COUNTS.conveyor, 6); if (!n || c.planned) return;
  const horiz = c.w > c.h, len = horiz ? c.w : c.h;
  for (let i = 0; i < n; i++) {
    const p = ((reduceMotion ? 0 : t * 0.18) + i / n + (c.x + c.y) * 0.13) % 1;
    const x = horiz ? c.x + p * len : c.x + c.w / 2, y = horiz ? c.y + c.h / 2 : c.y + p * len;
    ctx.save(); ctx.shadowColor = C.mustard; ctx.shadowBlur = 8; ctx.fillStyle = i % 2 ? C.mustard : "#ffdd7a";
    rrect(P(x) - 6, P(y) - 6, 12, 12, 3); ctx.fill(); ctx.restore();
  }
}
function drawCorridor(c) {
  const X = P(c.x), Y = P(c.y), Wd = P(c.w), Ht = P(c.h), horiz = c.w > c.h;
  if (c.planned) {
    ctx.save(); ctx.setLineDash([8, 6]); ctx.strokeStyle = C.plan; ctx.globalAlpha = 0.7; ctx.lineWidth = 2;
    if (horiz) { [Y, Y + Ht].forEach(yy => { ctx.beginPath(); ctx.moveTo(X, yy); ctx.lineTo(X + Wd, yy); ctx.stroke(); }); }
    else { [X, X + Wd].forEach(xx => { ctx.beginPath(); ctx.moveTo(xx, Y); ctx.lineTo(xx, Y + Ht); ctx.stroke(); }); }
    ctx.restore(); return;
  }
  ctx.fillStyle = C.corridor; ctx.fillRect(X, Y, Wd, Ht);
  ctx.strokeStyle = C.floorLine; ctx.lineWidth = 1;
  if (horiz) {
    for (let px = X + T; px < X + Wd; px += T) { ctx.beginPath(); ctx.moveTo(px, Y); ctx.lineTo(px, Y + Ht); ctx.stroke(); }
    ctx.fillStyle = C.wallTop; ctx.fillRect(X, Y - 8, Wd, 8); ctx.fillStyle = C.wallSide; ctx.fillRect(X, Y + Ht, Wd, 9);
    ctx.fillStyle = C.wallHi; ctx.fillRect(X, Y - 8, Wd, 2);
    hazard(X + 2, Y + 2, 10, Ht - 4); hazard(X + Wd - 12, Y + 2, 10, Ht - 4);
    ctx.fillStyle = "rgba(98,216,255,0.5)"; for (let px = X + 20; px < X + Wd - 20; px += 24) ctx.fillRect(px, Y + Ht / 2 - 1, 10, 2);
  } else {
    for (let py = Y + T; py < Y + Ht; py += T) { ctx.beginPath(); ctx.moveTo(X, py); ctx.lineTo(X + Wd, py); ctx.stroke(); }
    ctx.fillStyle = C.wallTop; ctx.fillRect(X - 8, Y, 8, Ht); ctx.fillRect(X + Wd, Y, 8, Ht);
    ctx.fillStyle = C.wallHi; ctx.fillRect(X - 8, Y, 2, Ht);
    hazard(X + 2, Y + 2, Wd - 4, 10); hazard(X + 2, Y + Ht - 12, Wd - 4, 10);
    ctx.fillStyle = "rgba(98,216,255,0.5)"; for (let py = Y + 20; py < Y + Ht - 20; py += 24) ctx.fillRect(X + Wd / 2 - 1, py, 2, 10);
  }
}

  },
  fixit(m, bp, t) {

    if (!bp) {
      ctx.save(); ctx.strokeStyle = "rgba(200,225,255,0.55)"; ctx.lineWidth = 1.5;
      for (let i = 1; i < 6; i++) { ctx.beginPath(); ctx.moveTo(P(ox + 3.2 + i * 0.6), P(oy + 2)); ctx.lineTo(P(ox + 3.2 + i * 0.6), P(oy + 4)); ctx.stroke(); }
      ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.strokeRect(P(ox + 3.8), P(oy + 2.5), P(1.2), P(0.9)); ctx.beginPath(); ctx.moveTo(P(ox + 5), P(oy + 3)); ctx.lineTo(P(ox + 6.2), P(oy + 3)); ctx.stroke(); ctx.restore();
    }
    box(bp, ox + 0.5, oy + 0.4, 3, 0.9, "#6b4a2e", "#8a6440");
    if (!bp) { ["#e3a72f", "#d94f8a", "#2f9c95", "#c9ced6"].forEach((c, i) => box(false, ox + 0.7 + i * 0.7, oy + 0.55, 0.45, 0.25, c)); }
    desk(bp, ox + 6.4, oy + 0.4, 3.2, 2, "#b06bff", t);

  vault(m, bp, t) {

    if (!bp) { ctx.strokeStyle = "#c9ced6"; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(P(ox + 8), P(oy + 1.7)); ctx.lineTo(P(ox + 8.45), P(oy + 1.35)); ctx.stroke(); }
    box(bp, ox + 0.5, oy + 0.4, 5, 1.3, "#0c1118", "#3b4250");
    if (!bp) {
      const tick = ["AAPL", "MSFT", "NVDA", "GOOG", "AMZN", "META", "AVGO", "TSLA"];
      ctx.save(); ctx.beginPath(); ctx.rect(P(ox + 0.6), P(oy + 0.45), P(4.8), P(0.45)); ctx.clip();
      ctx.font = `600 ${P(0.3)}px JetBrains Mono, monospace`; ctx.textAlign = "left";
      const gap = P(1.5), loop = gap * tick.length, off = reduceMotion ? 0 : (t * 18) % loop;
      tick.forEach((k, i) => { let x = i * gap - off; if (x < -gap) x += loop; ctx.fillStyle = i % 3 ? "#3cff6a" : "#ff5a5a"; ctx.fillText(k + (i % 3 ? " ▲" : " ▼"), P(ox + 0.7) + x, P(oy + 0.8)); });
      ctx.restore();
      ctx.save(); ctx.strokeStyle = "#4fa3ff"; ctx.lineWidth = 2; ctx.shadowColor = "#4fa3ff"; ctx.shadowBlur = 6; ctx.beginPath();
      [[0.7,1.6],[1.3,1.45],[1.9,1.5],[2.5,1.2],[3.1,1.3],[3.7,1.05],[4.3,1.1],[5.3,0.95]].forEach(([x,y],i)=> i ? ctx.lineTo(P(ox+x),P(oy+y)) : ctx.moveTo(P(ox+x),P(oy+y))); ctx.stroke(); ctx.restore();
    }
    desk(bp, ox + 1, oy + 3.2, 3.6, 3, "#4fa3ff", t);
    for (let i = 0; i < 4; i++) circle(bp, ox + 7.2 + (i % 2) * 0.8, oy + 4 + Math.floor(i / 2) * 0.8, 0.3, "#f2c230", "#a07a10");

};

/* ---------- Screen-space labels ---------- */
function pill(text, sx, sy, kind, size = 12) {
  ctx.font = `${kind === "name" ? 600 : 500} ${size}px ${kind === "name" ? "Oxanium" : "Inter"}, system-ui, sans-serif`;
  const w = ctx.measureText(text).width + 14, h = size + 9;
  ctx.fillStyle = kind === "name-sel" ? C.live : "rgba(6,10,18,0.82)";
  rrect(sx - w / 2, sy - h / 2, w, h, 4); ctx.fill();
  ctx.strokeStyle = kind === "plan" || kind === "planname" ? C.plan : kind === "worker" ? "rgba(98,216,255,0.6)" : "rgba(150,165,186,0.45)";
  ctx.lineWidth = 1; if (kind === "plan" || kind === "planname") ctx.setLineDash([4, 3]); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle = kind === "plan" || kind === "planname" ? C.plan : kind === "worker" ? C.live : kind === "off" ? "#c8b48a" : C.text;
  ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(text, sx, sy + 0.5);
}
C.text = "#e7edf6";
function drawLabels() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const detail = cam.z > 0.85;
  if (detail) {
    LABELS.forEach(l => { const s = toScreen(P(l.x), P(l.y)); pill(l.text, s.x, s.y, l.kind, 11); });
    bots.forEach(b => {
      const s = toScreen(P(b.x), P(b.y + 0.75));
      const a = b.key ? AGENTS[b.key] : null;
      if (b.placeholder) { if (cam.z > 1.4) pill("Placeholder", s.x, s.y, "off", 10); return; }
      if (b.manager) { pill(`${b.name} (manager)`, s.x, s.y, "worker", 11); return; }
      const text = b.bp ? `${b.name}: planned` : b.powered ? (a ? `${b.name}: ${a.status === "running" ? "working" : "ready"}` : b.name) : `${b.name}: powered down`;
      pill(text, s.x, s.y, b.bp ? "plan" : b.powered ? "worker" : "off", 11);
    });
  }
  MODULES.forEach(m => {
    const s = toScreen(P(m.x + m.w / 2), P(m.y) - 9);
    const kind = selected === m ? "name-sel" : m.status === "planned" ? "planname" : "name";
    pill(m.name.toUpperCase(), s.x, s.y - 8, kind, 12);
    if (selected === m) { ctx.fillStyle = "#05070d"; }
  });
}

/* ---------- Frame ---------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.05); last = now;
  const t = now / 1000;
  if (camTo) {
    const k = 1 - Math.exp(-dt * 6);
    cam.x += (camTo.x - cam.x) * k; cam.y += (camTo.y - cam.y) * k; cam.z += (camTo.z - cam.z) * k;
    if (Math.abs(camTo.z - cam.z) < 0.002 && Math.abs(camTo.x - cam.x) < 0.5) { Object.assign(cam, camTo); camTo = null; }
  }
  stepBots(dt);

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = "#05070d"; ctx.fillRect(0, 0, W, H);
  stars.forEach(s => { ctx.globalAlpha = s.a; ctx.fillStyle = "#cfd8ff"; ctx.fillRect(s.x * W, s.y * H, s.r, s.r); }); ctx.globalAlpha = 1;

  const c = vcenter();
  ctx.setTransform(dpr * cam.z, 0, 0, dpr * cam.z, dpr * (c.x - cam.x * cam.z), dpr * (c.y - cam.y * cam.z));
  // nebula glow behind the station
  const neb = ctx.createRadialGradient(P(14), P(30), 0, P(14), P(30), P(22));
  neb.addColorStop(0, "rgba(90,60,200,0.22)"); neb.addColorStop(1, "rgba(90,60,200,0)"); ctx.fillStyle = neb; ctx.fillRect(P(-10), P(5), P(50), P(50));
  const neb2 = ctx.createRadialGradient(P(42), P(6), 0, P(42), P(6), P(18));
  neb2.addColorStop(0, "rgba(40,120,200,0.18)"); neb2.addColorStop(1, "rgba(40,120,200,0)"); ctx.fillStyle = neb2; ctx.fillRect(P(20), P(-15), P(45), P(40));

  MODULES.forEach(m => drawShell(m, t));
  CORRIDORS.forEach(drawCorridor);
  CORRIDORS.forEach(c => corridorPackets(c, t));
  MODULES.forEach(m => FURNITURE[m.id](m, m.status === "planned", t));
  bots.slice().sort((a, b) => a.y - b.y).forEach(b => drawBot(b, t));
  if (pickedCrew !== null) {
    const b = bots.find(x => x.name === CREW[pickedCrew].name);
    if (b) { ctx.save(); ctx.strokeStyle = C.live; ctx.shadowColor = C.live; ctx.shadowBlur = 12; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(P(b.x), P(b.y - 0.15), P(0.75 + (reduceMotion ? 0 : 0.08 * Math.sin(t * 4))), 0, Math.PI * 2); ctx.stroke(); ctx.restore(); }
  }
  if (selected) { ctx.save(); ctx.strokeStyle = selected.status === "planned" ? C.plan : C.live; ctx.lineWidth = 3 / cam.z; ctx.shadowColor = ctx.strokeStyle; ctx.shadowBlur = 12; ctx.strokeRect(P(selected.x) - 14, P(selected.y) - 14, P(selected.w) + 28, P(selected.h) + 28); ctx.restore(); }

  drawLabels();
  requestAnimationFrame(frame);
}

/* ---------- Input: drag, zoom, pinch, tap ---------- */
const pointers = new Map();
let dragStart = null, pinchStart = null;
cv.addEventListener("pointerdown", e => {
  cv.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 1) dragStart = { x: e.clientX, y: e.clientY, cx: cam.x, cy: cam.y, moved: 0 };
  if (pointers.size === 2) { const [a, b] = [...pointers.values()]; pinchStart = { d: Math.hypot(a.x - b.x, a.y - b.y), z: cam.z }; }
  camTo = null;
});
cv.addEventListener("pointermove", e => {
  if (!pointers.has(e.pointerId)) {
    const w = toWorld(e.clientX, e.clientY);
    cv.style.cursor = MODULES.some(m => w.x >= P(m.x) && w.x <= P(m.x + m.w) && w.y >= P(m.y) && w.y <= P(m.y + m.h)) ? "pointer" : "grab";
    return;
  }
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 2 && pinchStart) {
    const [a, b] = [...pointers.values()];
    cam.z = Math.max(0.2, Math.min(3, pinchStart.z * Math.hypot(a.x - b.x, a.y - b.y) / pinchStart.d));
    if (dragStart) dragStart.moved = 99;
  } else if (dragStart) {
    const dx = e.clientX - dragStart.x, dy = e.clientY - dragStart.y;
    dragStart.moved = Math.max(dragStart.moved, Math.hypot(dx, dy));
    if (dragStart.moved > 4) { cv.classList.add("dragging"); cam.x = dragStart.cx - dx / cam.z; cam.y = dragStart.cy - dy / cam.z; }
  }
});
function endPointer(e) {
  if (!pointers.has(e.pointerId)) return;
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinchStart = null;
  if (pointers.size === 0) {
    cv.classList.remove("dragging");
    if (dragStart && dragStart.moved < 6 && e.type === "pointerup") {
      const w = toWorld(e.clientX, e.clientY);
      const hit = MODULES.find(m => w.x >= P(m.x) - 10 && w.x <= P(m.x + m.w) + 10 && w.y >= P(m.y) - 24 && w.y <= P(m.y + m.h) + 10);
      if (hit) select(hit.id);
    }
    dragStart = null;
  }
}
cv.addEventListener("pointerup", endPointer);
cv.addEventListener("pointercancel", endPointer);
cv.addEventListener("wheel", e => {
  e.preventDefault(); camTo = null;
  const before = toWorld(e.clientX, e.clientY);
  cam.z = Math.max(0.2, Math.min(3, cam.z * Math.exp(-e.deltaY * 0.0015)));
  const after = toWorld(e.clientX, e.clientY);
  cam.x += before.x - after.x; cam.y += before.y - after.y;
}, { passive: false });

window.addEventListener("resize", resize);
resize();
requestAnimationFrame(frame);
</script>
