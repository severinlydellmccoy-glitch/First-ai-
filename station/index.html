<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>First-ai Station</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oxanium:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-screen 3D station with rooms you fly into, a status readout top-left, and a control panel docked right (bottom sheet on phones). */
:root {
  --space: #060a12;
  --hull: rgba(12, 19, 33, 0.88);
  --line: #24344d;
  --text: #e7edf6;
  --muted: #95a3ba;
  --live: #62d8ff;
  --plan: #ffb547;
  --font-display: "Oxanium", "Segoe UI", system-ui, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; overflow: hidden; }
body {
  background: var(--space); color: var(--text); font-family: var(--font-body); font-size: 14px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
#scene { position: fixed; inset: 0; }
#scene canvas { display: block; touch-action: none; }
#fade { position: fixed; inset: 0; z-index: 5; background: #02040a; opacity: 0; pointer-events: none; transition: opacity 0.35s ease; }
#fade.on { opacity: 1; }

.hud {
  position: fixed; z-index: 3;
  top: calc(env(safe-area-inset-top, 0px) + 14px);
  left: max(16px, env(safe-area-inset-left, 0px));
  max-width: min(420px, calc(100% - 32px));
  pointer-events: none;
}
.hud h1 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 22px; letter-spacing: 0.04em; text-wrap: balance; }
.hud p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
.hud .counts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chip { font-family: var(--font-mono); font-size: 11.5px; padding: 3px 8px; border-radius: 4px; border: 1px solid var(--line); background: var(--hull); font-variant-numeric: tabular-nums; }
.chip.live { color: var(--live); border-color: color-mix(in srgb, var(--live) 40%, transparent); }
.chip.plan { color: var(--plan); border-color: color-mix(in srgb, var(--plan) 40%, transparent); }

#panel {
  position: fixed; z-index: 4;
  top: calc(env(safe-area-inset-top, 0px) + 14px);
  right: max(16px, env(safe-area-inset-right, 0px));
  width: 360px;
  max-height: calc(100% - 28px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
  overflow-y: auto;
  background: var(--hull); border: 1px solid var(--line); border-radius: 10px;
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  padding: 18px;
}
#panel h2 { margin: 0 0 4px; font-family: var(--font-display); font-size: 20px; font-weight: 700; letter-spacing: 0.03em; text-wrap: balance; }
#panel h3 { margin: 18px 0 8px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); }
#panel p { margin: 0; }
.lede { color: var(--muted); }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 99px; margin-bottom: 10px; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill.active { color: var(--live); background: color-mix(in srgb, var(--live) 14%, transparent); }
.pill.empty { color: var(--live); background: transparent; border: 1px dashed color-mix(in srgb, var(--live) 55%, transparent); }
.pill.planned { color: var(--plan); background: color-mix(in srgb, var(--plan) 14%, transparent); }

.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.list li { display: grid; gap: 1px; padding: 8px 10px; border-radius: 6px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05); }
.list .file { font-family: var(--font-mono); font-size: 12.5px; color: var(--live); }
.list .note { color: var(--muted); font-size: 13px; }
.list .none { color: var(--muted); font-style: italic; }

.rooms { display: grid; gap: 6px; }
.room-btn {
  display: grid; grid-template-columns: 10px 1fr auto; align-items: center; gap: 10px;
  width: 100%; text-align: left; font: inherit; color: var(--text); cursor: pointer;
  padding: 9px 10px; border-radius: 6px; border: 1px solid var(--line); background: rgba(255,255,255,0.02);
}
.room-btn:hover { border-color: var(--muted); background: rgba(255,255,255,0.05); }
.room-btn:focus-visible, .label:focus-visible, .back:focus-visible { outline: 2px solid var(--live); outline-offset: 2px; }
.dot { width: 10px; height: 10px; border-radius: 50%; }
.dot.active { background: var(--live); box-shadow: 0 0 8px var(--live); }
.dot.empty { border: 1.5px solid var(--live); }
.dot.planned { border: 1.5px dashed var(--plan); }
.room-btn small { color: var(--muted); font-size: 12px; }

.agent { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 8px 10px; border-radius: 6px; border: 1px dashed color-mix(in srgb, var(--plan) 35%, transparent); }
.agent.ready { border: 1px solid color-mix(in srgb, var(--live) 40%, transparent); }
.agent strong { font-weight: 600; }
.agent span { color: var(--plan); font-size: 12px; align-self: center; }
.agent.ready span { color: var(--live); }
.agent p { grid-column: 1 / -1; color: var(--muted); font-size: 13px; }

.legend { display: grid; gap: 6px; font-size: 13px; color: var(--muted); }
.legend div { display: flex; align-items: center; gap: 8px; }
.back { font: inherit; font-size: 13px; color: var(--muted); background: none; border: 0; padding: 0; margin-bottom: 12px; cursor: pointer; }
.back:hover { color: var(--text); }
.next { padding: 10px 12px; border-left: 2px solid var(--live); background: rgba(98,216,255,0.06); border-radius: 0 6px 6px 0; }
.next.planned { border-left-color: var(--plan); background: rgba(255,181,71,0.06); }
.foot { margin-top: 18px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }
a { color: var(--live); }
.hint { font-size: 13px; color: var(--muted); }
.enter {
  margin-top: 12px; width: 100%; font: inherit; font-weight: 600; cursor: pointer;
  padding: 9px 12px; border-radius: 6px; border: 1px solid var(--live); color: var(--space); background: var(--live);
}
.enter.planned { border-color: var(--plan); background: var(--plan); }

#labels { position: fixed; inset: 0; pointer-events: none; z-index: 2; }
.label {
  position: absolute; left: 0; top: 0; pointer-events: auto; cursor: pointer;
  font-family: var(--font-display); font-weight: 500; font-size: 12.5px; letter-spacing: 0.06em; white-space: nowrap;
  color: var(--text); background: rgba(6,10,18,0.72); border: 1px solid var(--line); border-radius: 4px; padding: 2px 8px;
  transform: translate(-50%, -100%);
}
.label.active, .label.empty { border-color: color-mix(in srgb, var(--live) 50%, transparent); }
.label.planned { color: var(--plan); border-style: dashed; border-color: color-mix(in srgb, var(--plan) 55%, transparent); }
.label.selected { background: var(--live); color: var(--space); border-color: var(--live); }
.label.planned.selected { background: var(--plan); border-color: var(--plan); }
.label.tag { cursor: default; pointer-events: none; font-family: var(--font-body); font-size: 12px; letter-spacing: 0; }
.label.tag.worker { color: var(--live); border-color: color-mix(in srgb, var(--live) 50%, transparent); }
.label.tag.off { color: var(--plan); border-style: dashed; border-color: color-mix(in srgb, var(--plan) 55%, transparent); }

@media (max-width: 700px) {
  .hud h1 { font-size: 18px; }
  .hud p { display: none; }
  #panel {
    top: auto; width: auto;
    left: max(16px, env(safe-area-inset-left, 0px));
    bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
    max-height: 44%;
    padding: 14px;
  }
  .label.tag { font-size: 11px; }
}
</style>

<div id="scene" aria-hidden="true"></div>
<div id="labels"></div>
<div id="fade"></div>
<header class="hud">
  <h1>FIRST-AI STATION</h1>
  <p>Merchandise sold on Etsy and Amazon, with the profits invested in stocks. Each module is one part of the business.</p>
  <div class="counts" id="counts"></div>
</header>
<aside id="panel" aria-live="polite"></aside>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const REPO = "https://github.com/severinlydellmccoy-glitch/First-ai-/tree/main/";
const SNAPSHOT = "19 Nov 2026";

// Real counts from the repository. Conveyor belts carry one item per real file.
const COUNTS = { reports: 0, approved: 0, denied: 0, drafts: 0, finals: 0, mediaDrafts: 0, mediaFinals: 0 };

// status: active = built and has work in it, empty = built but nothing made yet, planned = not built yet
const MODULES = [
  { id: "core", name: "Command Core", status: "active", folder: "",
    purpose: "The station's brain. It holds the instructions every Claude session reads before doing any work.",
    contents: [["CLAUDE.md", "Explains the business plan and the folders, and tells Claude to follow everything in the Rules Deck"], ["README.md", "Short description of the repository"], ["station/", "Backup copy of this space station"]],
    inside: "A control room with a hologram of the whole station and the console that holds CLAUDE.md.",
    agent: null,
    next: "Still to decide: the print-on-demand service and what share of profit to invest." },
  { id: "rules", name: "Rules Deck", status: "active", folder: "rules",
    purpose: "The rules every agent and every Claude session must follow.",
    contents: [["general.md", "Original art only, cite and date research, keep finished work apart from drafts, never store passwords or keys"], ["working-with-me.md", "Your rules: three questions first, check the work, thorough but readable, no tech-speak"], ["README.md", "Index of the rule files"]],
    inside: "An archive with one glowing tablet for each rule file.",
    agent: null,
    next: "Add any rules of your own, such as a budget, a style, or products to avoid." },
  { id: "research", name: "Research Lab", status: "empty", folder: "research",
    purpose: "Market research: what merchandise is selling on Etsy, Amazon and Temu. Decides what the station makes.",
    contents: [["README.md", "How to name and write research notes"], ["scout/", "The Scout's weekly reports (0 so far)"]],
    emptyNote: "No reports yet.",
    inside: "The Scout works at a wall of market screens. Each idea it finds rides the belt through a scanner to three robot judges: Demand, Safety and Profit. The judges decide for themselves. Only ideas all three approve go into the report bin, and the rest drop into the denied bin. The belt stays empty until the first report exists.",
    agent: "scout",
    next: "The Scout's first test report runs at 9 pm Central. If the data is good, it switches to a weekly schedule." },
  { id: "art", name: "Art Studio", status: "empty", folder: "art",
    purpose: "Original artwork and designs that become products. Drafts and finished designs are kept apart.",
    contents: [["README.md", "How drafts and finished designs are stored"], ["drafts/", "0 files"], ["final/", "0 files"]],
    emptyNote: "No designs yet.",
    inside: "Easels with blank canvases, a workbench, and two bins: drafts and final. The Artist is powered down until it has a design to make.",
    agent: "artist",
    next: "Waiting on the Research Lab to pick what to make." },
  { id: "media", name: "Media Bay", status: "empty", folder: "media",
    purpose: "Mockups, product photos, video, social posts and listing text that sell the products.",
    contents: [["README.md", "How media files are stored and named"], ["drafts/", "0 files"], ["final/", "0 files"]],
    emptyNote: "No media yet.",
    inside: "A photo stage with lights and a camera, and a mockup belt. The lights are off and the Producer is powered down.",
    agent: "producer",
    next: "Waiting on the first finished designs from the Art Studio." },
  { id: "sales", name: "Sales Dock", status: "planned", folder: null,
    purpose: "Lists merchandise on Etsy and Amazon, sets prices, and keeps track of orders.",
    contents: [],
    emptyNote: "Not built yet. There is no folder for it.",
    inside: "A blueprint: a packing line that will send orders out to shipping pods for Etsy and Amazon.",
    agent: "seller",
    next: "To build it: open seller accounts on Etsy and Amazon, and pick a print-on-demand service that makes and ships the products." },
  { id: "observatory", name: "Observatory", status: "planned", folder: null,
    purpose: "Watches what sells and sends the results back to the Research Lab, so the next round of products is better.",
    contents: [],
    emptyNote: "Not built yet. There is no folder for it.",
    inside: "A blueprint: a telescope pointed at the marketplaces and wall charts of sales.",
    agent: "analyst",
    next: "To build it: the Sales Dock needs products listed first." },
  { id: "vault", name: "Investment Vault", status: "planned", folder: null,
    purpose: "Moves a share of the merchandise profits into stocks and keeps a record of every investment.",
    contents: [],
    emptyNote: "Not built yet. There is no folder for it.",
    inside: "A blueprint: a safe and a profit counter.",
    agent: "treasurer",
    next: "To build it: the business needs profits first. Then decide what share of profit to invest and which brokerage account to use." },
];

// status: ready = set up but hasn't done any work yet, running = has produced work, planned = not set up
const AGENTS = {
  scout:     { name: "Scout",     status: "ready",   home: "research",    job: "Finds which merchandise sells best on Amazon, Etsy and Temu. Three judges (Demand, Safety, Profit) vote on every idea, and only ideas all three approve make the report.", note: "Set up and waiting for its first run." },
  artist:    { name: "Artist",    status: "planned", home: "art",         job: "Creates original designs." },
  producer:  { name: "Producer",  status: "planned", home: "media",       job: "Makes mockups, photos, posts and listing text." },
  seller:    { name: "Seller",    status: "planned", home: "sales",       job: "Lists products and keeps prices up to date." },
  analyst:   { name: "Analyst",   status: "planned", home: "observatory", job: "Reads the sales numbers and suggests what to make next." },
  treasurer: { name: "Treasurer", status: "planned", home: "vault",       job: "Tracks profits and keeps the investment record. You make the final call on every investment." },
};

const STATUS_TEXT = { active: "Built, with work inside", empty: "Built, nothing made yet", planned: "Under construction" };
const AGENT_STATUS = { ready: "Ready", running: "Running", planned: "Planned" };
const byId = Object.fromEntries(MODULES.map(m => [m.id, m]));
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- Panel ---------- */
const panel = document.getElementById("panel");
const built = MODULES.filter(m => m.status !== "planned").length;
const agentList = Object.values(AGENTS);
const ready = agentList.filter(a => a.status !== "planned").length;
document.getElementById("counts").innerHTML =
  `<span class="chip live">${built} of ${MODULES.length} modules built</span>` +
  `<span class="chip live">${ready} of ${agentList.length} agents ready</span>` +
  `<span class="chip plan">${agentList.filter(a => a.status === "running").length} running</span>`;

function agentCard(key) {
  const a = AGENTS[key];
  const note = a.status === "planned" ? "Not set up yet." : a.note;
  return `<div class="agent ${a.status}"><strong>${a.name}</strong><span>${AGENT_STATUS[a.status]}</span><p>${a.job} ${note}</p></div>`;
}

function renderOverview() {
  panel.innerHTML = `
    <h2>Station overview</h2>
    <p class="lede">Lit modules exist in your GitHub repository. Orange outlines are parts of the business that are planned but not built yet. Every module has a room inside.</p>
    <h3>Modules</h3>
    <div class="rooms">${MODULES.map(m => `
      <button class="room-btn" type="button" data-room="${m.id}">
        <span class="dot ${m.status}"></span><span>${m.name}</span><small>${m.status === "planned" ? "Planned" : m.status === "empty" ? "Empty" : "Active"}</small>
      </button>`).join("")}
    </div>
    <h3>Agents</h3>
    <p class="hint" style="margin-bottom:8px">The robot workers are the AI helpers. A worker lights up once its agent is set up, and its conveyor fills as real work gets saved.</p>
    <div class="rooms">${Object.keys(AGENTS).map(agentCard).join("")}</div>
    <h3>Key</h3>
    <div class="legend">
      <div><span class="dot active"></span>Built, with work inside</div>
      <div><span class="dot empty"></span>Built, nothing made yet</div>
      <div><span class="dot planned"></span>Planned, not built yet</div>
    </div>
    <h3>Getting around</h3>
    <p class="hint">Drag to look around. Scroll or pinch to zoom. Tap a module, or its name tag, to fly inside its room.</p>
    <p class="foot">Snapshot of the repository on ${SNAPSHOT}. Claude updates the station as the business grows.</p>`;
}

function renderRoom(m, insideRoom) {
  const contents = m.contents.length
    ? `<ul class="list">${m.contents.map(([f, n]) => `<li><span class="file">${f}</span><span class="note">${n}</span></li>`).join("")}</ul>`
    : "";
  const empty = m.emptyNote ? `<ul class="list" style="margin-top:6px"><li><span class="none">${m.emptyNote}</span></li></ul>` : "";
  const where = m.folder !== null
    ? `<a href="${REPO}${m.folder}" target="_blank" rel="noopener">Open ${m.folder ? m.folder + "/" : "the repository"} on GitHub</a>`
    : "";
  panel.innerHTML = `
    <button class="back" type="button" data-back>&larr; ${insideRoom ? "Leave room" : "Station overview"}</button>
    <h2>${m.name}</h2>
    <span class="pill ${m.status}">${STATUS_TEXT[m.status]}</span>
    <p class="lede">${m.purpose}</p>
    <h3>In this room</h3>
    <p class="hint">${m.inside}</p>
    <h3>What's inside now</h3>
    ${contents}${empty}
    ${where ? `<p style="margin-top:10px;font-size:13px">${where}</p>` : ""}
    <h3>Worker</h3>
    ${m.agent ? agentCard(m.agent) : `<p class="hint">No worker here. Every agent reads this module before starting.</p>`}
    <h3>Next step</h3>
    <p class="next ${m.status === "planned" ? "planned" : ""}">${m.next}</p>`;
  panel.scrollTop = 0;
}

let select = () => {}, leaveRoom = () => {};
panel.addEventListener("click", e => {
  const room = e.target.closest("[data-room]");
  if (room) return select(room.dataset.room);
  if (e.target.closest("[data-back]")) leaveRoom();
});
document.addEventListener("keydown", e => { if (e.key === "Escape") leaveRoom(); });

renderOverview();

/* ---------- 3D ---------- */
if (!window.THREE || !THREE.OrbitControls) {
  panel.insertAdjacentHTML("afterbegin", `<p class="next planned" style="margin-bottom:12px">The 3D view couldn't load. Check your connection and reload the page. Everything below still works.</p>`);
} else {
  const LIVE = 0x62d8ff, PLAN = 0xffb547;
  const host = document.getElementById("scene");
  const fadeEl = document.getElementById("fade");
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  host.appendChild(renderer.domElement);

  const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 1000);
  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true; controls.dampingFactor = 0.08; controls.enablePan = false;
  const isPhone = () => window.innerWidth < 700;

  function mesh(geo, mat, x = 0, y = 0, z = 0) { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); return m; }

  /* 70s palette for the rooms */
  const RETRO = { orange: 0xe8692c, mustard: 0xe3a72f, avocado: 0x8a9a3b, brown: 0x5a3825, cream: 0xf3e3c3, magenta: 0xd94f8a, teal: 0x2f9c95 };
  function canvasTex(w, h, draw) {
    const c = document.createElement("canvas"); c.width = w; c.height = h; draw(c.getContext("2d"), w, h);
    const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; return t;
  }
  let texCache;
  function retroTextures() {
    if (texCache) return texCache;
    const shag = canvasTex(256, 256, (g, w, h) => {
      g.fillStyle = "#8a4a22"; g.fillRect(0, 0, w, h);
      const shades = ["#a85a28", "#6e3a1c", "#c46a2e", "#7d4420", "#b8642c"];
      g.lineWidth = 2;
      for (let i = 0; i < 5000; i++) {
        g.strokeStyle = shades[i % shades.length];
        const x = Math.random() * w, y = Math.random() * h;
        g.beginPath(); g.moveTo(x, y); g.lineTo(x + (Math.random() - 0.5) * 6, y + (Math.random() - 0.5) * 6); g.stroke();
      }
    });
    shag.repeat.set(6, 6);
    const rug = canvasTex(512, 512, (g, w) => {
      const cols = ["#e8692c", "#e3a72f", "#f3e3c3", "#8a9a3b", "#5a3825", "#d94f8a"];
      for (let i = 12; i > 0; i--) { g.fillStyle = cols[i % cols.length]; g.beginPath(); g.arc(w / 2, w / 2, (i / 12) * w / 2, 0, Math.PI * 2); g.fill(); }
    });
    rug.wrapS = rug.wrapT = THREE.ClampToEdgeWrapping;
    const wall = canvasTex(64, 256, (g, w, h) => {
      const bands = [["#3b2418", 0.3], ["#5a3825", 0.1], ["#e8692c", 0.09], ["#e3a72f", 0.09], ["#f3e3c3", 0.09], ["#8a9a3b", 0.09], ["#d94f8a", 0.04], ["#3b2418", 0.2]];
      let y = 0; bands.forEach(([c, f]) => { g.fillStyle = c; g.fillRect(0, y, w, f * h + 1); y += f * h; });
    });
    wall.repeat.set(1, 1);
    texCache = { shag, rug, wall };
    return texCache;
  }

  /* ===== Station (outside) ===== */
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x060a12);
  scene.add(new THREE.AmbientLight(0x6070a0, 0.7));
  const sun = new THREE.DirectionalLight(0xfff4e6, 1.2); sun.position.set(25, 30, 15); scene.add(sun);
  const rim = new THREE.DirectionalLight(0x4f7cff, 0.5); rim.position.set(-20, -10, -20); scene.add(rim);

  const starGeo = new THREE.BufferGeometry(), sp = [];
  for (let i = 0; i < 2000; i++) {
    const v = new THREE.Vector3(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5).normalize();
    v.multiplyScalar(250 + Math.random() * 200); sp.push(v.x, v.y, v.z);
  }
  starGeo.setAttribute("position", new THREE.Float32BufferAttribute(sp, 3));
  scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xcfd8ff, size: 1.6, sizeAttenuation: false })));

  const planet = mesh(new THREE.SphereGeometry(32, 64, 48), new THREE.MeshStandardMaterial({ color: 0x1f3d68, roughness: 1 }), -70, -40, -110);
  scene.add(planet);
  const atmo = mesh(new THREE.SphereGeometry(34, 64, 48), new THREE.MeshBasicMaterial({ color: 0x4f9dff, transparent: true, opacity: 0.12, side: THREE.BackSide }));

    } else {

    const start = pos.clone().normalize().multiplyScalar(3.4), end = pos.clone().normalize().multiplyScalar(R - 1.6);

    const g = new THREE.Group();
    g.add(mesh(new THREE.CylinderGeometry(0.3, 0.52, 0.3, 20), trim, 0, 0.15, 0));
    g.add(mesh(new THREE.CylinderGeometry(0.36, 0.32, 0.75, 20), body, 0, 0.65, 0));
    const head = new THREE.Group(); head.position.y = 1.05;
    head.add(mesh(new THREE.SphereGeometry(0.34, 24, 16), dome, 0, 0.3, 0));

    const armL = mesh(armGeo, trim, -0.43, 0.68, 0.05), armR = mesh(armGeo, trim, 0.43, 0.68, 0.05);
    armL.rotation.z = -0.2; armR.rotation.z = 0.2; g.add(armL, armR);

    g.userData = { head, armR, powered };
    return g;

  function conveyor(len, n, moving, M) {
    const g = new THREE.Group();
    g.add(mesh(new THREE.BoxGeometry(len, 0.12, 0.9), M.belt, 0, 0.7, 0));
    [-1, 1].forEach(s => g.add(mesh(new THREE.BoxGeometry(len, 0.1, 0.06), M.metal, 0, 0.8, s * 0.48)));
    [-len / 2 + 0.3, 0, len / 2 - 0.3].forEach(x => g.add(mesh(new THREE.BoxGeometry(0.12, 0.65, 0.8), M.dark, x, 0.32, 0)));
    const items = [];
    for (let i = 0; i < n; i++) { const it = mesh(new THREE.BoxGeometry(0.42, 0.3, 0.5), M.item, 0, 0.92, 0); g.add(it); items.push(it); }
    const place = t => items.forEach((it, i) => { const p = ((moving ? t * 0.12 : 0) + i / n) % 1; it.position.x = -len / 2 + 0.3 + p * (len - 0.6); });
    place(0);
    g.userData.update = moving ? place : null;
    return g;
  }

    g.add(mesh(new THREE.CylinderGeometry(0.06, 0.2, 0.35, 24), chrome, 0, 2.17, 0));

  function shell(room, bp) {
    const s = room.scene;
    if (bp) {

    research(r, M) {

      const scout = robot(AGENTS.scout.status !== "planned", false, RETRO.mustard); scout.position.set(-3.6, 0, -2.1); scout.rotation.y = Math.PI; r.add(scout); r.worker(scout);

      const scanGlow = mesh(new THREE.TorusGeometry(0.92, 0.035, 6, 40), M.glow, -1.3, 0.9, 2.4); scanGlow.rotation.y = Math.PI / 2; r.add(scanGlow);
      r.tick(t => { scanGlow.material.opacity = 0.25 + 0.35 * (0.5 + 0.5 * Math.sin(t * 2.5)); screens.forEach((s, i) => s.material.emissiveIntensity = 0.75 + 0.2 * Math.sin(t * 3 + i * 2)); });
      const b = bin(1.5, M); b.position.set(5.4, 0, 2.4); r.add(b);
      const nb = bin(1.3, M); nb.position.set(5.4, 0, 4.6); r.add(nb);
      // Judges' bench: three robots who vote on every idea
      const bench = new THREE.Group(); bench.position.set(1.8, 0, 0.6);
      bench.add(mesh(new THREE.BoxGeometry(4.6, 0.12, 0.9), M.wood, 0, 1.25, 0));

      });
      if (COUNTS.approved + COUNTS.denied > 0) {
        r.tick(t => lamps.forEach((l, i) => { const ok = Math.sin(t * 1.5 + i * 1.7) > -0.3; l.material.emissive.setHex(ok ? 0x3cff6a : 0xff3b3b); l.material.emissiveIntensity = 1.2; }));
      }
      if (belt.userData.update) r.tick(belt.userData.update);
      const w = workerTag("scout");
      r.label(w.text, -3.6, 2.35, -2.1, w.cls);
      r.label("Market scanner", -1.3, 2.25, 2.4);
      r.label(`Report belt: ${n} report${n === 1 ? "" : "s"}`, 2.2, 1.35, 2.4);
      r.label(`Approved: ${COUNTS.approved}`, 5.4, 1.1, 2.4);
      r.label(`Denied: ${COUNTS.denied}`, 5.4, 1.0, 4.6);
      r.label("The judges decide for themselves", 1.8, 3.55, -0.1);
    },
    art(r, M) {
      [[-3.2, -2.4, 0.35], [-0.4, -3.4, 0]].forEach(([x, z, ry]) => {
        const e = new THREE.Group(); e.position.set(x, 0, z); e.rotation.y = ry;
        [[-0.45, 0.15], [0.45, 0.15], [0, -0.35]].forEach(([lx, lz]) => {
          const leg = mesh(new THREE.CylinderGeometry(0.04, 0.04, 2.1, 6), M.wood, lx, 1.05, lz); leg.rotation.x = lz < 0 ? -0.18 : 0.05; e.add(leg);
        });
        e.add(mesh(new THREE.BoxGeometry(1.3, 1.0, 0.05), M.canvas, 0, 1.55, 0.2));
        r.add(e);
      });
      const bench = new THREE.Group(); bench.position.set(3.4, 0, -2.6);
      bench.add(mesh(new THREE.BoxGeometry(2.6, 0.1, 1.1), M.wood, 0, 0.9, 0));
      [-1.1, 1.1].forEach(x => bench.add(mesh(new THREE.BoxGeometry(0.1, 0.9, 1), M.dark, x, 0.45, 0)));
      bench.add(mesh(new THREE.BoxGeometry(0.5, 0.12, 0.35), M.metal, -0.6, 1.01, 0));
      bench.add(mesh(new THREE.CylinderGeometry(0.12, 0.12, 0.3, 12), M.light, 0.5, 1.1, 0.1));
      r.add(bench);
      const artist = robot(AGENTS.artist.status !== "planned", false, RETRO.orange); artist.position.set(-1.8, 0, -1.1); artist.rotation.y = Math.PI * 0.85; r.add(artist); r.worker(artist);
      const bd = bin(1.4, M); bd.position.set(-2.2, 0, 3); r.add(bd);
      const bf = bin(1.4, M); bf.position.set(2.2, 0, 3); r.add(bf);
      const w = workerTag("artist");
      r.label(w.text, -1.8, 2.35, -1.1, w.cls);
      r.label("Blank canvases", -1.8, 2.45, -3.6);
      r.label(`Drafts: ${COUNTS.drafts}`, -2.2, 1.1, 3);
      r.label(`Final: ${COUNTS.finals}`, 2.2, 1.1, 3);
    },
    media(r, M) {
      r.add(mesh(new THREE.BoxGeometry(4.4, 3, 0.1), M.light, 0, 1.5, -5.2));
      r.add(mesh(new THREE.BoxGeometry(4.4, 0.04, 2.2), M.light, 0, 0.02, -4.1));
      const mug = new THREE.Group(); mug.position.set(0, 0.05, -4.2);
      mug.add(mesh(new THREE.CylinderGeometry(0.26, 0.24, 0.48, 24), M.canvas, 0, 0.24, 0));
      const handle = mesh(new THREE.TorusGeometry(0.13, 0.035, 8, 20), M.canvas, 0.3, 0.26, 0); mug.add(handle);
      r.add(mug);
      [-2.6, 2.6].forEach(x => {
        const st = new THREE.Group(); st.position.set(x, 0, -2.8);
        st.add(mesh(new THREE.CylinderGeometry(0.04, 0.04, 2.2, 6), M.dark, 0, 1.1, 0));
        const box = mesh(new THREE.BoxGeometry(0.9, 0.9, 0.3), M.lampOff, 0, 2.3, 0); box.lookAt(-x * 0.4, 0.5, -4.2 + 2.8); st.add(box);
        r.add(st);
      });
      const cam = new THREE.Group(); cam.position.set(0, 0, -0.2);
      [-0.3, 0.3].forEach(x => { const l = mesh(new THREE.CylinderGeometry(0.03, 0.03, 1.4, 6), M.dark, x, 0.7, 0.15); l.rotation.z = x * 0.6; cam.add(l); });
      const back = mesh(new THREE.CylinderGeometry(0.03, 0.03, 1.4, 6), M.dark, 0, 0.7, -0.2); back.rotation.x = -0.3; cam.add(back);
      cam.add(mesh(new THREE.BoxGeometry(0.55, 0.38, 0.32), M.dark, 0, 1.5, 0));
      const lens = mesh(new THREE.CylinderGeometry(0.12, 0.14, 0.3, 16), M.metal, 0, 1.5, -0.3); lens.rotation.x = Math.PI / 2; cam.add(lens);
      r.add(cam);
      const prod = robot(AGENTS.producer.status !== "planned", false, RETRO.teal); prod.position.set(1.2, 0, 0.5); prod.rotation.y = Math.PI * 1.15; r.add(prod); r.worker(prod);
      const n = COUNTS.mediaDrafts + COUNTS.mediaFinals;
      const belt = conveyor(5.5, n, n > 0, M); belt.position.set(0, 0, 3.6); r.add(belt);
      if (belt.userData.update) r.tick(belt.userData.update);
      const w = workerTag("producer");
      r.label(w.text, 1.2, 2.35, 0.5, w.cls);
      r.label("Photo stage (lights off)", 0, 3.3, -5.2);
      r.label(`Mockup belt: ${n} item${n === 1 ? "" : "s"}`, 0, 1.35, 3.6);
    },
    sales(r, M) {
      const belt = conveyor(7, 0, false, M); belt.position.set(0, 0, 0.6); r.add(belt);
      for (let i = 0; i < 4; i++) r.add(mesh(new THREE.BoxGeometry(0.9, 0.7, 0.9), M.wood, -5 + (i % 2) * 1, 0.35 + Math.floor(i / 2) * 0.72, -2.6));
      const pod = new THREE.Group(); pod.position.set(5.4, 0, -2.4);
      pod.add(mesh(new THREE.CylinderGeometry(0.9, 0.9, 1.8, 16), M.metal, 0, 1.2, 0));
      pod.add(mesh(new THREE.SphereGeometry(0.9, 16, 8, 0, Math.PI * 2, 0, Math.PI / 2), M.metal, 0, 2.1, 0));
      pod.add(mesh(new THREE.ConeGeometry(0.9, 0.5, 16), M.metal, 0, 0.05, 0));
      r.add(pod);
      const seller = robot(false, true, RETRO.avocado); seller.position.set(0, 0, 2.2); seller.rotation.y = Math.PI; r.add(seller); r.worker(seller);
      r.label("Seller: planned, powered down", 0, 2.35, 2.2, "off");
      r.label("Packing line (not built)", 0, 1.35, 0.6, "off");
      r.label("Shipping pod: Etsy and Amazon", 5.4, 3.4, -2.4, "off");
      r.label("Under construction", 0, 3.6, -5, "off");
    },
    observatory(r, M) {
      const ts = new THREE.Group(); ts.position.set(0, 0, -2.4);
      ts.add(mesh(new THREE.CylinderGeometry(0.5, 0.8, 1.2, 16), M.metal, 0, 0.6, 0));
      const tube = mesh(new THREE.CylinderGeometry(0.35, 0.45, 3.4, 16), M.metal, 0, 2.2, -0.6); tube.rotation.x = -0.75; ts.add(tube);
      r.add(ts);
      [-4, 4].forEach(x => {
        const board = mesh(new THREE.BoxGeometry(2.6, 1.6, 0.08), M.metal, x, 1.8, -5.6); board.lookAt(0, 1.8, 0); r.add(board);
      });
      const an = robot(false, true, RETRO.magenta); an.position.set(2, 0, 0.4); an.rotation.y = -Math.PI * 0.8; r.add(an); r.worker(an);
      r.label("Analyst: planned, powered down", 2, 2.35, 0.4, "off");
      r.label("Market telescope", 0, 4.3, -3.4, "off");
      r.label("Sales charts", -4, 3, -5.6, "off");
      r.label("Under construction", 0, 0.3, 3.6, "off");
    },
    vault(r, M) {
      r.add(mesh(new THREE.BoxGeometry(2.8, 2.8, 2), M.metal, 0, 1.4, -4));
      const door = mesh(new THREE.CylinderGeometry(0.9, 0.9, 0.12, 24), M.metal, 0, 1.4, -2.95); door.rotation.x = Math.PI / 2; r.add(door);
      for (let i = 0; i < 5; i++) r.add(mesh(new THREE.CylinderGeometry(0.25, 0.25, 0.2 + i * 0.12, 16), M.metal, 3 + (i % 3) * 0.6, (0.2 + i * 0.12) / 2, -0.8 + Math.floor(i / 3) * 0.6));
      const tr = robot(false, true, RETRO.brown); tr.position.set(-2.2, 0, -0.4); tr.rotation.y = Math.PI * 0.8; r.add(tr); r.worker(tr);
      r.label("Treasurer: planned, powered down", -2.2, 2.35, -0.4, "off");
      r.label("Investment safe", 0, 3.3, -4, "off");
      r.label("Profit counter", 3.6, 1.4, -0.5, "off");
      r.label("Under construction", 0, 0.3, 3.6, "off");
    },
  };

  const rooms = {};
  function buildRoom(id) {
    if (rooms[id]) return rooms[id];
    const m = byId[id], bp = m.status === "planned";
    const room = { scene: new THREE.Scene(), ticks: [], workers: [], labels: [] };
    room.add = (...o) => room.scene.add(...o);
    room.tick = f => room.ticks.push(f);
    room.worker = w => room.workers.push(w);
    room.label = (text, x, y, z, cls = "") => {
      const el = document.createElement("div"); el.className = `label tag ${cls}`; el.textContent = text; el.hidden = true;
      labelLayer.appendChild(el); room.labels.push({ el, pos: new THREE.Vector3(x, y, z) });
    };
    shell(room, bp);
    ROOM_BUILDERS[id](room, mats(bp));
    rooms[id] = room;
    return room;
  }

  /* ===== Navigation ===== */
  let current = null; // room object when inside, null when outside
  let fly = null, selected = null;
  const stationLimits = () => { controls.minDistance = 5; controls.maxDistance = 70; controls.maxPolarAngle = Math.PI; };
  const roomLimits = () => { controls.minDistance = 3; controls.maxDistance = isPhone() ? 18 : 14; controls.maxPolarAngle = 1.45; };
  stationLimits();

  function overviewView() {
    return isPhone() ? { target: new THREE.Vector3(0, -7, 0), cam: new THREE.Vector3(0, 24, 44) } : { target: new THREE.Vector3(6, 0, 0), cam: new THREE.Vector3(6, 17, 31) };
  }
  function roomView() {
    return isPhone() ? { target: new THREE.Vector3(0, -2.5, 0), cam: new THREE.Vector3(0, 9, 14) } : { target: new THREE.Vector3(2.2, 0.8, 0), cam: new THREE.Vector3(2.2, 6, 10.5) };
  }
  function flyTo(view, done) {
    if (reduceMotion) { controls.target.copy(view.target); camera.position.copy(view.cam); done && done(); return; }
    fly = { t: 0, fromT: controls.target.clone(), toT: view.target, fromC: camera.position.clone(), toC: view.cam, done };
  }
  function fadeSwap(fn) {
    if (reduceMotion) { fn(); return; }
    fadeEl.classList.add("on");
    setTimeout(() => { fn(); requestAnimationFrame(() => fadeEl.classList.remove("on")); }, 360);
  }
  function showRoomLabels(room, on) { if (room) room.labels.forEach(l => { l.el.hidden = !on; }); }

  function enterRoom(id) {
    const room = buildRoom(id);
    fadeSwap(() => {
      current = room; fly = null;
      MODULES.forEach(m => { m.label.hidden = true; });
      roomLimits();
      const v = roomView(); controls.target.copy(v.target); camera.position.copy(v.cam);
      showRoomLabels(room, true);
      renderRoom(byId[id], true);
    });
  }

  select = id => {
    if (current) return;
    if (selected) selected.label.classList.remove("selected");
    selected = byId[id];
    selected.label.classList.add("selected");
    renderRoom(selected, false);
    const w = new THREE.Vector3(); selected.group.getWorldPosition(w);
    const out = id === "core" ? new THREE.Vector3(0, 0, 1) : w.clone().setY(0).normalize();
    flyTo({ target: w.clone(), cam: w.clone().add(out.multiplyScalar(id === "core" ? 6 : 4.5)).add(new THREE.Vector3(0, 1.5, 0)) }, () => enterRoom(id));
  };

  leaveRoom = () => {
    if (!current) {
      if (selected) { selected.label.classList.remove("selected"); selected = null; }
      renderOverview(); flyTo(overviewView()); return;
    }
    const leaving = current;
    fadeSwap(() => {
      showRoomLabels(leaving, false);
      current = null; stationLimits();
      if (selected) { selected.label.classList.remove("selected"); selected = null; }
      const v = overviewView(); controls.target.copy(v.target); camera.position.copy(v.cam);
      renderOverview();
    });
  };

  const start = overviewView(); controls.target.copy(start.target); camera.position.copy(start.cam);

  const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
  let downAt = null;
  function pick(e) {
    if (current) return null;
    const r = renderer.domElement.getBoundingClientRect();
    ptr.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(ptr, camera);
    const hit = ray.intersectObjects(hits, false)[0];
    return hit ? hit.object.userData.id : null;
  }
  renderer.domElement.addEventListener("pointerdown", e => { downAt = [e.clientX, e.clientY]; });
  renderer.domElement.addEventListener("pointerup", e => {
    if (!downAt) return;
    const moved = Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]); downAt = null;
    if (moved < 6) { const id = pick(e); if (id) select(id); }
  });
  renderer.domElement.addEventListener("pointermove", e => {
    if (e.pointerType === "mouse") renderer.domElement.style.cursor = pick(e) ? "pointer" : "grab";
  });

  function resize() {
    const w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix();
  }
  window.addEventListener("resize", resize); resize();

  const clock = new THREE.Clock(), tmp = new THREE.Vector3();
  const ease = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  function placeLabel(el, v, w, h) {
    tmp.copy(v).project(camera);
    if (tmp.z > 1) { el.hidden = true; return; }
    el.hidden = false;
    el.style.transform = `translate(${(tmp.x * 0.5 + 0.5) * w}px, ${(-tmp.y * 0.5 + 0.5) * h}px) translate(-50%, -100%)`;
  }
  function frame() {
    const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
    if (!reduceMotion) {
      if (!current) {
        if (!selected && !fly) station.rotation.y += dt * 0.04;
        coreRing.rotation.z += dt * 0.25;
        drones.forEach(d => {
          const a = t * 0.7 + d.phase;
          d.obj.position.set(Math.cos(a) * 2.7, 1.3 + Math.sin(t * 1.6 + d.phase) * 0.35, Math.sin(a) * 2.7);
          d.obj.rotation.y = t * 1.5;
        });
        beacons.forEach((b, i) => { b.material.opacity = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(t * 3 + i)); });
        tip.material.color.setHex(Math.sin(t * 2) > 0 ? LIVE : 0x2c6a80);
      } else {
        current.ticks.forEach(f => f(t));
        current.workers.forEach((wk, i) => {
          if (!wk.userData.powered) return;
          wk.position.y = Math.sin(t * 2 + i) * 0.04;
          wk.userData.head.rotation.y = Math.sin(t * 0.7 + i) * 0.35;
          wk.userData.armR.rotation.x = Math.sin(t * 3 + i) * 0.35;
        });
      }
    } else if (!current) {
      drones.forEach(d => d.obj.position.set(Math.cos(d.phase) * 2.7, 1.3, Math.sin(d.phase) * 2.7));
    }
    if (fly) {
      fly.t = Math.min(1, fly.t + dt / 1.1); const e = ease(fly.t);
      controls.target.lerpVectors(fly.fromT, fly.toT, e);
      camera.position.lerpVectors(fly.fromC, fly.toC, e);
      if (fly.t === 1) { const done = fly.done; fly = null; done && done(); }
    }
    controls.update();
    renderer.render(current ? current.scene : scene, camera);

    const w = window.innerWidth, h = window.innerHeight;
    if (current) current.labels.forEach(l => placeLabel(l.el, l.pos, w, h));
    else MODULES.forEach(m => {
      m.group.getWorldPosition(tmp); tmp.y += m.labelHeight;
      placeLabel(m.label, tmp.clone(), w, h);
    });
    requestAnimationFrame(frame);
  }
  frame();
}
</script>
